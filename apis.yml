apis:
- aid: enphase:enphase-monitoring-api
  name: Enphase Monitoring API
  description: >-
    The Monitoring API is the consumer-data surface of the Enphase platform and the only
    self-serve one. Documented across 48 paths and eight tags — System Details, Site Level
    Production Monitoring, Site Level Consumption Monitoring, Device Level Monitoring, EV
    Charger Monitoring, EV Charger Control, System Configurations and Streaming APIs — it
    lets a registered application retrieve an individual system owner's solar production,
    household consumption, IQ Battery telemetry and microinverter-level data after that owner
    approves the application through an OAuth 2.0 authorization-code grant. Access controls
    are scoped per plan: the free Watt plan (10 hits/minute, 1,000 hits/month) covers system
    details, site-level production, site-level consumption and EV charger monitoring, while
    device-level production monitoring requires the paid Kilowatt or Megawatt plans.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer-v4.enphase.com/docs/monitoring_api
  baseURL: https://api.enphaseenergy.com/api/v4
  tags:
