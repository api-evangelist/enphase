- aid: enphase:enphase-vpp-api
  name: Enphase VPP API
  description: >-
    The Virtual Power Plant API is the grid-services surface, sold only to utilities,
    aggregators, DERMS providers and third-party owners registered as Enphase Grid Services
    partners — the pricing page carries no numbers, only "Contact us" for a demo. Documented
    as an OpenAPI 3.0.1 contract across 55 paths and eight tags — Manage VPPs, Programs,
    Events, Enrolment via Applications, Forecast, System Details And Telemetry, System and
    Device Configuration, and Auth — it creates and operates VPP programs, enrols homes,
    dispatches demand-response events, forecasts fleet capacity, and steers PV, battery,
    EVSE, heat pump and HVAC assets. It is the only Enphase API that implements a recognised
    interoperability standard: OCPP 1.6 endpoints configure and reset EV charger
    communication against a partner's own Charging Station Management System.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer-v4.enphase.com/docs/vpp_api
  baseURL: https://vpp.enphaseenergy.com
