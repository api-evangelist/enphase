- aid: enphase:enphase-commissioning-api
  name: Enphase Commissioning API
  description: >-
    The Commissioning API is the installer-facing administrative surface, documented across
    21 paths and eleven tags — Activations, Arrays, Companies, Users, Home Owner, Meters,
    Grid Profiles, Tariff, Estimate, PvManufacturers and PvModels. It creates and updates
    site activations, manages installer companies and users, sets grid profiles, and updates
    the utility tariff and rate-plan data attached to a site, which is the closest this
    company comes to touching utility retail pricing. It is not self-serve: the Partner plan
    is restricted to registered Enphase installers with at least ten installations, requires
    a credit card on file, and authenticates through an OAuth 2.0 password grant against
    Enphase cloud credentials rather than a homeowner consent redirect.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer-v4.enphase.com/docs/commissioning_api
  baseURL: https://api.enphaseenergy.com/api/v4
