aid: enphase
url: https://raw.githubusercontent.com/api-evangelist/enphase/refs/heads/main/apis.yml
name: Enphase Energy
kind: company
description: >-
  Enphase Energy is a Petaluma, California home-energy technology manufacturer and the
  dominant supplier of solar microinverters in the United States, shipping IQ Microinverters,
  IQ Batteries, IQ EV Chargers and the Envoy/IQ Gateway that ties them together through the
  Enlighten cloud. It sits on the DER side of the energy value chain rather than the utility
  side: it does not own meters, sell electricity, or operate a grid, so no consumer energy
  data mandate reaches it — there is no Green Button, ESPI or NAESB implementation anywhere
  in its developer surface, and the United States has no compulsory retail energy data right
  to designate it under. Its API posture is nevertheless unusually open for this sector. The
  Enphase Developer Portal at developer-v4.enphase.com is a genuine self-serve 3scale portal
  where anyone can register, create an application and subscribe to a free Watt plan, and it
  publishes three complete, anonymously downloadable machine-readable contracts covering 124
  paths and 148 operations. The split that defines Enphase is consumer-data-open,
  market-data-closed: a
  third-party developer can retrieve an individual homeowner's site production, consumption,
  battery and EV charger telemetry through documented OAuth 2.0 authorization-code flows with
  the system owner's explicit approval, but Enphase publishes no open grid, wholesale market
  or system-wide generation data of any kind. Access is tiered — self-serve for monitoring,
  application-approval for installer commissioning (10+ installations required), and
  partner-only for the Virtual Power Plant API, which is the one place a real standard
  appears: OCPP 1.6 for EV charger control against third-party CSMS platforms.
