  - site_id
  type: integer/string
  domain: The Enlighten site. Called system_id in the Monitoring and Commissioning APIs and site_id in
    the VPP API - the same identifier.
- id: activation_id
  type: integer
  domain: A Commissioning API activation - the installer-side record that becomes a system.
- id: serial_no
  aka:
  - serial_number
  type: string
  domain: 'Device serial: IQ Microinverter, IQ Battery (Encharge), IQ Gateway (Envoy), IQ EV Charger (EVSE),
    heat pump, meter.'
- id: company_id
  type: integer
  domain: Installer company in the Commissioning API.
- id: user_id
  type: integer
  domain: Enlighten user attached to a company or an activation.
- id: vpp_id
  type: string
  domain: A Virtual Power Plant in the VPP API.
- id: program_id
  type: string
  domain: A grid-services program a VPP runs.
- id: event_id
  type: string
  domain: A demand-response event dispatched against a program.
- id: pv_manufacturer_id
  type: integer
  domain: PV module manufacturer in the Commissioning API catalog.
