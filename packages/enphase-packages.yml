summary: >-
  Enphase ships no first-party client library in any language. Its GitHub organisation
  (github.com/enphase, 6 public repos, contact open-source@enphaseenergy.com) publishes hardware
  and lab engineering tools - a Rust fixed-point filter library, an NL5 circuit-simulator binding,
  pyqtgraph scope plots, a KiCad constraint matrix and a lab interlock controller - and nothing
  that touches the Enlighten Systems API. The developer portal offers copy-paste cURL, raw HTTP,
  PHP-cURL and Python http.client samples in the quick start guide instead of an SDK. Every client
  library below is community-maintained; none is endorsed by Enphase.
