duplicateWarning:
  note: >-
    A separate repository for the same company already exists at
    /Users/kinlane/GitHub/all/enphase-energy/ (aid enphase-energy, created 2026-06-13),
    carrying nine tag-split OpenAPIs and a populated apis.yml. This repo (aid enphase) was
    bootstrapped as instructed, but the two describe one company and should be reconciled
    under the duplicate-provider-retirement process — pick a survivor, tombstone the other —
    before either is published or scored, or the catalog will double-count Enphase.

findings:
  summary: >-
    Enphase is the clean control case for the central question of this sector: it proves that
    a good energy API and an energy data mandate have nothing to do with each other. No
    obligation reaches it — not CDR, not Ontario's Green Button regulation, not a US federal
    right that does not exist — and it has not voluntarily adopted Green Button either, which
    was verified by grepping all three contracts and the portal docs for Green Button, ESPI,
    NAESB, OpenADR, IEEE 2030.5 and CIM and finding nothing. And yet it ships the most
    accessible surface most utilities in this sector will never match: a live 3scale portal,
    published plans and rate limits, a free tier anyone can self-register for, and 124
    operations across three specifications that download anonymously without a key. The
    posture is consumer-data-open and market-data-closed, the mirror image of the typical
    utility, because Enphase is a manufacturer monetising telemetry from equipment it sold
    rather than a grid operator disclosing in the public interest. Two things temper the
    picture: the OAuth model is documented only in prose, with no securityDefinitions in any
    contract, and the Commissioning API's resource-owner password grant is a deprecated
    pattern for a surface that manages installer accounts and site activations. One defect
    was found and preserved rather than fixed — the published Monitoring API spec declares
    host api-qa2.enphaseenergy.com, a QA hostname shipped in a production contract.
  strengths:
    - Genuinely self-serve free tier with published rate limits, rare in energy.
    - Three complete machine-readable contracts served anonymously, including for a partner-only API.
    - Real OAuth 2.0 authorization-code consent with the application name shown to the homeowner.
    - OCPP 1.6 implemented for EV charger control rather than a proprietary shape.
    - Product segmentation in the docs maps cleanly to the three contracts.
  weaknesses:
    - No securityDefinitions or securitySchemes in any of the three specs; auth is prose-only.
    - Deprecated password grant on the installer-facing Commissioning API.
    - QA hostname api-qa2.enphaseenergy.com published in the Monitoring API contract.
    - No open data of any kind; nothing anonymous, aggregate, or system-wide.
    - No standard on the consumer-data path — proprietary JSON, no Green Button/ESPI.
    - Legacy v2 portal still serving years past its stated 2024-06-30 end of life.
    - Portal homepage still carries unreplaced "Lorem ipsum" placeholder text in three panels.

