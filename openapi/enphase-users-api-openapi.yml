        schema:
          type: string
      tags:
      - Users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                    description: The Enlighten ID of the user
                  company_id:
                    type: integer
                    description: The Enlighten ID of the company that the user belongs to. If the user does not belong to a company, this field will not be present in the response.
              example:
