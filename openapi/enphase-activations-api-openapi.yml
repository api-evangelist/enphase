      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                system_name:
                  type: string
                  description: The name of the system. Limit 255 characters.
                system_type:
                  type: string
                  description: The type of the system. Possible values are 'residential', 'commercial', 'other'. Default 'residential'.
                internet_connection:
                  type: string
                  description: How the system's Envoys connect to the Internet. Possible values are none, cellular, broadband, dialup. Use 'dialup' if the Internet connection is satellite or dial-up
                lease:
                  type: boolean
                  description: Whether the system is leased. Possible values true, false. Default false
                operational:
                  type: boolean
                  description: Whether this system is permitted to operate. Possible values true, false. Default true
                owner_id:
                  type: integer
                  description: Enlighten ID of the system owner. Owner must be an Enlighten user. Optional. If the user of the API is a self-installer, the owner must be himself. If the user of the API is an installer then use the Search user API to get the owner user id. If the owner not exist in the enlighten then use Create home owner API to create it newly.
                host_id:
                  type: integer
                  description: Enlighten ID of the system host. System host must be an Enlighten user. Optional. If the user of the API is an installer then use the Search user API to get the host user id. If the host not exist in the enlighten then use Create home owner API to create it newly.
                authorized_subcontractor_id:
                  type: integer
                  description: Enlighten ID of the sub-contractor you want to add to the system. Optional.
                installer_id:
                  type: integer
                  description: The Enlighten ID of the installer of this system. Defaults to current user's company ID
                maintainer_id:
                  type: integer
                  description: The Enlighten ID of the maintainer of this system. Defaults to current user's company ID
                allow_public_access:
                  type: boolean
                  description: When true, the system will be eligible to appear in the public systems lists of Enphase and the system's installer. Default true
                interconnect_date:
                  type: integer
                  description: When the system was approved to connect to the grid. Epoch in seconds format
                source:
                  type: string
                  description: The source of production measurements taken on the system. Possible values 'meter', 'microinverters'. When 'meter', production values come from a revenue-grade meter on the system. When 'microinverters', production values come from the microinverters on the system.
                array_type:
                  type: string
                  enum:
                  - fixed_open_rack
                  - fixed_roof_mount
                  - single_axis_tracking
                  - single_axis_backtracking
                  - dual_axis_tracking
                  description: The type of array installed. Possible values are fixed_open_rack, fixed_roof_mount, single_axis_tracking, single_axis_backtracking, dual_axis_tracking. All other values will be ignored. To unset array_type, pass null
                attachment_type:
                  type: string
                  enum:
                  - rack_mount
                  - zep
                  - acm
                  - bipv
                  - frame_mount
                  - railless_mount
                  description: How the microinverters are attached to the panels. Possible values are acm (AC Module), rack_mount (rack- or rail-mounted), zep (Zep Solar compatible), bipv (Building Integrated PV), frame_mount (Enphase Frame Mount), railless_mount (Other Railless Mount)
                ensemble_envoy:
                  type: string
                  description: Specifies serial number of ensemble envoy in multi envoy system
                grid_profile:
                  type: string
                  description: The grid profile to set on this system's microinverters. See GridProfiles API for how to retrieve a list of known profiles.
                requested_profile:
                  type: string
                  description: ''
                requested_report_freq:
                  type: string
                  description: ''
                voltage:
                  type: string
                  description: The supported voltage/phase associated with a commercial system inside North America. If system type is not commercial, or if the installer exists & installer's country is not inside North America, or if the system's country is not inside North America, then the voltage value would be null
                envoy_serial_numbers:
                  type: array
                  items:
                    type: string
                  description: A list of Envoys installed on this system
                pv_manufacturer:
                  type: integer
                  description: Enlighten ID of the PV manufacturer associated with the PV model installed on the system. See PvManufacturers for how to retrieve PV manufacturer IDs
                pv_manufacturer_name:
                  type: string
                  description: Name of the Custom PV Module Manufacturer associated with the system.
                pv_model:
                  type: integer
                  description: Enlighten ID of the PV model installed on the system. See PvManufacturers and PvModels for how to retrieve PV model IDs
                pv_model_name:
                  type: string
                  description: Name of the Custom PV Module Model associated with the system.
                pv_module_power_rating:
                  type: number
                  format: float
                  minimum: 0
                  description: Power Rating (in W) of the PV module installed on the system.
                pv_module_type:
                  type: integer
                  enum:
                  - 1
                  - 2
                  - 3
                  - 4
                  description: Type ID of the PV module installed on the system. 1 -> 'Mono-facial', 2 -> 'Bi-facial', 3 -> 'Split cell', 4 -> 'Other'
                expected_envoy_count:
                  type: integer
                  description: Total envoys the system is supposed to have
                expected_pcu_count:
                  type: integer
                  description: Total PCUs the system is supposed to have
                expected_acb_count:
                  type: integer
                  description: Total acbs the system is supposed to have
                expected_nsr_count:
                  type: integer
                  description: Total nsrs the system is supposed to have
                expected_meter_count:
                  type: integer
                  description: Total meters the system is supposed to have
                expected_encharge_count:
                  type: integer
                  description: Total encharges the system is supposed to have
                expected_enpower_count:
                  type: integer
                  description: Total enpowers the system is supposed to have
                reference:
                  type: string
                  description: The identifier of this system as provided by the calling user's company. This attribute is not present if the calling user's company does not have a reference for this system. This value should be alphanumberic
                encharge:
                  type: array
                  description: Encharge detail
                  items:
                    type: object
                    properties:
                      envoy_serial_number:
                        type: string
                        description: Envoy serial number
                      encharge_serial_numbers:
                        type: array
                        description: Encharge serial numbers
                        items:
                          type: string
                enpower:
                  type: array
                  description: Enpower detail
                  items:
                    type: object
                    properties:
                      envoy_serial_number:
                        type: string
                        description: Envoy serial number
                      enpower_serial_numbers:
                        type: array
                        description: Enpower serial numbers
                        items:
                          type: string
                address:
                  type: object
                  description: The location of the system. Use a valid two-letter code for state. Use the ISO 3166-1 2-letter code for the country. Latitude and longitude are calculated by Enlighten, not provided by the client. Address is mandatory if users company belongs to US.
                  properties:
                    street1:
                      type: string
                    street2:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    country:
                      type: string
                    postal_code:
                      type: string
                  required:
                  - street1
                  - city
                  - state
                  - country
                  - postal_code
                grid_connection_type:
                  type: integer
                  description: 'This field is mandatory for sites in California, United States. Possible values for parameter: 1 – Net Billing Tariff (NEM 3.0), 2 – Net Metering, 3 – Net Feed-in tariff, 4 – Gross Feed-in tariff'
                battery_grid_mode:
                  type: integer
                  description: This field is mandatory for sites with battery in California, United States when grid_connection_type is 1. Battery grid mode must be either 1 (for Import Only) or 2 ( for Export Only).
                third_party_storage_device_installed:
                  type: boolean
                  description: This field is mandatory for sites in California, United States. Whether third party storage device is installed on the site.
                third_party_storage_device_manufacturer:
                  type: string
                  description: This field is mandatory for sites in California, United States when the third_party_storage_device_installed field is passed as true. Manufacturer name of the third party storage device.
                interconnection_application_date:
                  type: integer
                  description: Date in epoch format
                permission_to_operate:
                  type: boolean
                  description: boolean (true / false)
              required:
              - system_name
  /api/v4/partner/activations/{activation_id}:
    get:
      summary: Retrieves an Activation by id
      description: 'By default, the body of the response looks like the example below. However, you can choose to retrieve more information about the activation using response expansion, for example: Instead of returning only the owner''s name within the system hash, the response includes detailed information about the owner by using expand=owner. You can also expand the owner''s company by using expand=owner.company. The response now includes information about the owner and the company he belongs to, if any. By using expand=host will include details about the system host. You can also expand the host''s company by using expand=host.company. The response now includes information about the host and the company he belongs to'
      parameters:
      - name: activation_id
        in: path
        description: The Enlighten ID of the activation(system). System-generated.
        required: true
        schema:
          type: integer
      - name: expand
        in: query
        description: 'Retrieve more information about the activation. The expand query parameter is a comma-separated list of associations to expand. It may include the following:'
