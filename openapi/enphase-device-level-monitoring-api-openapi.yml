  /api/v4/systems/{system_id}/{serial_no}/evse_telemetry:
    get:
      summary: Retrieves telemetry data of the EVSE charger at regular intervals.
      description: 'Retrieves telemetry data of the EVSE charger at regular intervals. If no start_at is specified, defaults to midnight today, in the timezone of the system. If the start_at specified is earlier than the system’s first reported date, then midnight of the system’s first reported date is considered as start_at. The end_at is calculated as the minimum of the time of the request and (start time + granularity). The meaning of granularity is as follow: If granularity is 15mins, maximum 1 intervals will appear in response. If granularity is day, maximum 96 intervals will appear in response where each interval is of 15 mins duration. The requested start date must be within 2 years from current date.'
      parameters:
      - name: system_id
        in: path
        description: The unique numeric ID of the system
        required: true
        schema:
          type: integer
      - name: serial_num
        in: path
        description: Serial Number of the EV Charger
        required: true
        schema:
          type: string
      - name: start_at
        in: query
        description: Start time for fetching the telemetry data in Epoch time format. Alternatively one can use start_date in place of start_at for passing the start date as String date format YYYY-MM-DD
        schema:
          type: integer
      - name: granularity
        in: query
        description: The granularity of the telemetry data. Possible values are 'week', 'day', '15mins', '5mins'. Default is 'day'
        schema:
          type: string
      - name: interval_duration
        in: query
        description: Size of the interval. Can be 5mins, or 15mins. Site must be configured to 5 min telemetry for this to be supported
        schema:
          type: string
      tags:
      - Device Level Monitoring
      responses:
        '200':
          description: EVSE telemetry in intervals
          content:
            application/json:
              schema:
                type: object
                properties:
                  system_id:
                    type: integer
                    description: The unique numeric ID of the system
                  granularity:
                    type: string
                    description: The granularity of the telemetry data. Possible values are 'week', 'day', '15mins', '5mins'. Default is 'day'
                  interval_duration:
                    type: string
                    description: Size of the interval. Can be 5mins, or 15mins. Site must be configured to 5 min telemetry for this to be supported
                  start_at:
                    type: string
                    description: Start Time of the data series. Either Start_date or start_at will be present. By default start_at will appear in response. If start_date parameter is passed in the url, then start_date field will appear in response.
                  end_at:
                    type: string
                    description: End Time of the data series. Either end_date or end_at will be present. By default end_at will appear in response. If end_date parameter is passed in the url, then end_date field will appear in response.
                  items:
                    type: string
                    description: The list key 'intervals'
                  intervals:
                    type: array
                    description: Energy units consumed per day (positive will correspond to energy consumption, negative will correspond to zero consumption). The time series includes one entry for each day from the start_date to the end_date with no gaps in the time series. If the response contains trailing zeroes, such as [909, 4970, 0, 0, 0], then there is no  consumption by the HP
                    items:
                      type: array
                      items:
                        properties:
                          end_at:
                            type: integer
                            description: End time of the telemetry interval
                          wh_consumed:
                            type: integer
                            description: Energy units consumed per interval (positive will correspond to EV charge, negative will correspond to EV discharge)
              example:
                system_id: 698905955
                granularity: day
                interval_duration: 5mins
                start_at: 1496526300
                end_at: 1496528100
                items: intervals
                intervals:
                - end_at: 1496527200
                  wh_consumed: 40
                - end_at: 1496527260
                  wh_consumed: 30
                - end_at: 1496527320
                  wh_consumed: -10
