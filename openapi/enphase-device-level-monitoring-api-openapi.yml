      - name: system_id
        in: path
        description: The unique numeric ID of the system
        required: true
        schema:
          type: integer
      - name: start_date
        in: query
        description: The start_date defaults to the system’s operational date. If the start_date is earlier than the system’s operational_date, then the response data begins with the system operational_date as start_date. Pass as String date format YYYY-MM-DD
        schema:
          type: string
      - name: end_date
        in: query
        description: End date for fetching the daily time-series data. Pass as String date format YYYY-MM-DD. Defaults to today.
