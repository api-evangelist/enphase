  /api/v1/events:
    get:
      tags:
      - Events
      summary: Retrieve all events in a program
      description: Returns a paginated list of all events in a program and total count of events based on the inputted program_id
      operationId: getEvents_1
      parameters:
      - name: program_id
        in: query
        description: Unique ID of the program
        required: true
        schema:
          type: string
      - name: page_no
        in: query
        description: Page to be returned. Default=1, Min=1. For example, if page_no is set to 2, 2nd page is returned
        required: false
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 1
      - name: page_size
        in: query
        description: Maximum number of records shown per page. Default=10, Min=1, Max=100. For example, if max is set to 5, 5 records are shown per page
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 10
      - name: start_date
        in: query
        description: Start date for fetching the events list in yyyy-MM-dd format. If start_date is not specified, will be defaulted to today's date
        required: false
        schema:
          type: string
      - name: end_date
        in: query
        description: End date for fetching the events list in yyyy-MM-dd format. If end_date is not specified, will be defaulted to start_date + 7 days. Date range is restricted to a maximum of 30 days
        required: false
        schema:
          type: string
      - name: site_id
        in: query
        description: Site Id to fetch corresponding events
        required: false
        schema:
          type: string
      - name: event_status
        in: query
        description: 'Event Status to fetch corresponding events. Event statuses can be one of them: scheduled, in_progress, completed, stopped, failed, deleted, optedout'
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: Unique API Key of your account
        required: true
        schema:
          type: string
        example: your-api-key-here
      - name: Authorization
        in: header
        description: access_token generated from auth API must be passed as Authorization header
        required: true
        schema:
          type: string
        example: Bearer your-access-token
      responses:
        '200':
          description: All the events are retrieved successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventsListResponse'
              examples:
                Example Response:
                  summary: Sample event list
                  description: Example Response
                  value:
                    program_id: test
                    total_count: 2
                    eventList:
                    - event_id: f75b0ada-ee9b-4cdb-b0f1-b915267d203c
                      name: Event 202203241315
                      program_id: test
                      events:
                      - site_id: '698934045'
                        event_status: completed
                        start_time: '2022-03-24T13:15:00.000+00:00'
                        end_time: '2022-03-24T13:30:00.000+00:00'
                        created_at: '2022-03-24T11:15:00.000+00:00'
                        completed_at: '2022-03-24T13:30:00.000+00:00'
                        function: BATTERY
                        mode: Discharge_To_Load_Grid
                        target_soc: 10
                        rate_watt: 1200
                        command_delivery_status: Delivered
                        superseded: false
        '400':
          description: Bad Request
          content:
            '*/*':
              examples:
                case-0:
                  value: "{\n  \"code\": \"400\",\n  \"displayMessage\": \"Pagination variables are incorrect\",\n  \"additionalInfo\": \"Pagination variables are incorrect. Page number should starts from 1 and page size should be between 1 and 100\",\n  \"errorRefNo\": \"e20fdf9aa241bea9\",\n}"
                case-1:
