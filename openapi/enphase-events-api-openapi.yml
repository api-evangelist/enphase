    post:
      tags:
      - Events
      summary: Create a new Event in a program
      description: 'Create a new event for a site with function as either PV or BATTERY or HP or EVSE.

        The current version only supports the ability to create an event for single site.

        If function is PV, PV curtailment can be done on the site.

        If the function is BATTERY, the battery can be charged or discharged or set to Idle.

        If the function is HP, SG ready mode 1, 2, 3 or 4 can be configured for the heat pump.

        If the function is EVSE, charge mode can be configured for the EVSE.

        Superseded flag can be used for site level events to override existing site level events. If superseded is false and there is an overlap with existing event, the new event will not be considered.

        '
      operationId: createEvent
      parameters:
      - name: x-api-key
        in: header
        description: Unique API Key of your account
        required: true
        schema:
          type: string
        example: your-api-key-here
      - name: Authorization
        in: header
        description: access_token generated from auth API must be passed as Authorization header
        required: true
        schema:
          type: string
        example: Bearer your-access-token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequestV2'
            examples:
              example-0:
                value: "{\n    \"program_id\":\"test\",\n    \"site_ids\": [12345],\n    \"measuring_reference\":\"ASSET\",\n    \"functions\": [\"PV\"],\n    \"rate_watt\": 1000,\n    \"start_time\" : \"2022-04-08 06:00\",\n    \"end_time\" : \"2022-04-08 08:00\"\n}\n"
              example-1:
                value: "{\n    \"program_id\": \"test\",\n    \"site_ids\": [12345],\n    \"measuring_reference\":\"ASSET\",\n    \"functions\": [\"PV\"],\n    \"rate_watt\": 1000,\n    \"duration\": 30\n}\n"
              example-2:
                value: "{\n    \"program_id\": \"test\",\n    \"site_ids\": [12345],\n    \"measuring_reference\":\"ASSET\",\n    \"functions\": [\"EVSE\"],\n    \"mode\": \"Charge\",\n    \"evse_serial_no\": \"23412313\",\n    \"rate_watt\": -1000,\n    \"duration\": 30\n}\n"
              example-3:
                value: "{\n    \"program_id\": \"test\",\n    \"site_ids\": [12345],\n    \"measuring_reference\":\"ASSET\",\n    \"functions\": [\"HP\"],\n    \"mode\": \"MODE_2\",\n    \"duration\": 30\n}\n"
              example-4:
                value: "{\n    \"program_id\": \"test\",\n    \"site_ids\": [12345],\n    \"measuring_reference\":\"ASSET\",\n    \"functions\": [\"BATTERY\"],\n    \"mode\": \"Discharge_To_Load_Grid\",\n    \"target_soc\": 10,\n    \"rate_watt\": 3000,\n    \"start_time\": \"2022-04-08 06:00\",\n    \"duration\": 30\n}\n"
              example-5:
                value: "{\n    \"program_id\": \"test\",\n    \"site_ids\": [12345],\n    \"measuring_reference\":\"ASSET\",\n    \"functions\": [\"BATTERY\"],\n    \"target_soc\": 100,\n    \"rate_watt\": -3000,\n    \"duration\": 30\n}\n"
              example-6:
                value: "{\n    \"program_id\": \"test\",\n    \"site_ids\": [12345],\n    \"measuring_reference\":\"ASSET\",\n    \"functions\": [\"BATTERY\"],\n    \"target_soc\": 100,\n    \"rate_watt\": -3000,\n    \"duration\": 30,\n    \"superseded\": true\n}\n"
        required: true
      responses:
        '200':
          description: Event created successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventResponse'
              examples:
                EventCreationResponse:
                  summary: Successful event creation response
                  description: EventCreationResponse
                  value:
                    message: Event created successfully
                    event_id: f75b0ada-ee9b-4cdb-b0f1-b915267d203c
                    name: Event 202204061130
