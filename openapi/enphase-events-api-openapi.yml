    post:
      tags:
      - Events
      summary: Create a new Event in a program
      description: 'Create a new event in a program. Event start time must be at least 1 minute from the current time. Event Start time can be a maximum of 7 days from the current time.


        Event Duration (Event End Time - Event Start Time) must be a minimum of 5 minutes and a maximum of 5 hours.


        Events can be created for a single site or a list of sites or a list of VPPs and hence either Site ID or Site IDs or VPP IDs must be passed. Batteries will function as per the mode specified in the request till either the target SOC is reached or event duration has passed. Depending on the mode specified, the battery will charge or discharge based on various parameters such as rate_watt, PV generation, Load, and rated power of the battery. If the mode is IDLE, battery will neither discharge or charge. For events created for a VPP or list of sites, rate_watt will be distributed across sites.


        Superseded flag can be used for site level events to override existing site level events. If superseded is false and there is an overlap with existing event, the new event will not be considered.


        Recommendation: When events are created for a list of sites or VPPs, ensure that the number of sites are less than 500. As the number of sites increase, the latency of the API increases and might result in failure of event creation. If the number of sites are more than 500, recommendation is to split the VPP into smaller VPPs with each VPP size less than 500 sites.

        '
      operationId: createEvent_1
      parameters:
      - name: x-api-key
        in: header
        description: Unique API Key of your account
        required: true
        schema:
          type: string
        example: your-api-key-here
      - name: Authorization
        in: header
        description: access_token generated from auth API must be passed as Authorization header
        required: true
        schema:
          type: string
        example: Bearer your-access-token
      requestBody:
        description: JSON request to create an event
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
            examples:
              example-0:
                value: "{\n    \"program_id\":\"test\",\n    \"site_id\": 12345,\n    \"function\":\"BATTERY\",\n    \"mode\":\"Discharge_To_Load_Grid\",\n    \"target_soc\":10,\n    \"rate_watt\": 3000,\n    \"start_time\" : \"2022-04-08 06:00\",\n    \"end_time\" : \"2022-04-08 08:00\",\n    \"superseded\": false\n}\n"
              example-1:
                value: "{\n    \"program_id\": \"test\",\n    \"site_ids\": [12345,96789,45320],\n    \"function\": \"BATTERY\",\n    \"mode\": \"Discharge_To_Load_Grid\",\n    \"target_soc\": 10,\n    \"rate_watt\": 3000,\n    \"start_time\": \"2022-04-08 06:00\",\n    \"end_time\": \"2022-04-08 08:00\",\n    \"superseded\": false\n}\n"
              example-2:
                value: "{\n    \"program_id\": \"test\",\n    \"vpp_ids\": [\"testvpp1\",\"testvpp2\"],\n    \"function\": \"BATTERY\",\n    \"mode\": \"Discharge_To_Load_Grid\",\n    \"target_soc\": 10,\n    \"rate_watt\": 3000,\n    \"start_time\": \"2022-04-08 06:00\",\n    \"end_time\": \"2022-04-08 08:00\",\n    \"superseded\": false\n}\n"
        required: true
      responses:
        '200':
          description: Event created successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventResponse'
              examples:
                SuccessfulEventCreation:
                  summary: Sample response after creating an event
                  description: SuccessfulEventCreation
                  value:
                    message: Event created successfully
                    event_id: f75b0ada-ee9b-4cdb-b0f1-b915267d203c
                    name: Event 202204061130
                    no_of_sites: 1
                    program_id: test
                    total_watts: 1200
        '400':
          description: Bad Request
          content:
            '*/*':
              examples:
                case-0:
                  value: "{\n  \"code\": \"400\",\n  \"displayMessage\": \"program_id cannot be null\",\n  \"additionalInfo\": \"program_id cannot be null. please provide program_id of the event\",\n  \"errorRefNo\": \"e20fdf9aa241bea9\",\n}"
                case-1:
                  value: "{\n  \"code\": \"400\",\n  \"displayMessage\": \"start_time format should be yyyy-MM-dd HH:mm\",\n  \"additionalInfo\": \"start_time format should be yyyy-MM-dd HH:mm\",\n  \"errorRefNo\": \"e20fdf9aa241bea9\",\n}"
