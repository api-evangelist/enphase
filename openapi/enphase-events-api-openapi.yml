components:
  schemas:
    GsApiEventResponse:
      type: object
      properties:
        site_id:
          type: string
          description: Unique ID of the site
        evse_serial_no:
          type: string
          description: Serial Number of the individual EVSE
        event_status:
          type: string
          description: "current status of the event\n\t\n-scheduled : Event created and is yet to start\n\t\n-in_progress : Event created and has started\n\t\n-completed : Event started and end time has passed\n\t\n-stopped : Event stopped by creator after it has started\n\t\n-failed : Command not acknowledged by the gateway. VPP API cloud sends a command and waits for the status from gateway. If it expires, a retry is done; Retries are done up to 5 minutes from the event start time. If the command still does not succeed after 5 minutes, then it will be marked as failed\n\t\n-deleted : Event cancelled by creator before start time or Event cancelled by the system due to a completely overlapping event\n\t\n-optedout : HO opted out of the event\n"
        failure_code:
          type: string
          description: Event failure code
        failure_reason:
          type: string
          description: Reason for the event failure
        start_time:
          type: string
          description: Date and time at which the event starts
          format: date-time
        end_time:
          type: string
          description: Date and time at which the event ends
          format: date-time
        created_at:
          type: string
          description: Date and time at which the event is created
          format: date-time
        completed_at:
          type: string
          description: Date and time at which the event is completed
          format: date-time
        cancelled_at:
          type: string
          description: Date and time on which the event is cancelled
          format: date-time
        cancellation_request:
          type: string
        function:
          type: string
          description: supported function for v1 api
        functions:
          type: array
          description: List of supported functions
          items:
            type: string
            description: List of supported functions
            enum:
            - BATTERY
            - PV
            - EVSE
            - HP
        duration:
          type: integer
          description: Event duration in minutes
          format: int32
        mode:
          type: string
          description: "\tMode for the event; Mandatory if functions is  HP/EVSE, optional in case of BATTERY and not applicable in case of PV\n\n\tIf function is BATTERY,\n\t\t1. If mode is not passed, it is set to 'Discharge to Load and Grid' if rate_watt is positive\n\t\t2. If mode is not passed, it is set to 'Charge from PV and Grid' if rate_watt is negative\n\t\t3. If mode is not passed, it is set to 'Idle' if rate_watt is 0\n\t\t4. If mode is passed, rate_watt must be positive for discharge events, negative for charge events, 0 for Idle event\n\n\tIf function is BATTERY, supported modes are:\n\t\tIdle\n\t\tCharge_From_PV\n\t\tCharge_From_NetPV\n\t\tCharge_From_PV_Grid\n\t\tDischarge_To_Load\n\t\tDischarge_To_NetLoad\n\t\tDischarg_To_Load_Grid\n\n\tIf function is HP, supported modes are as per SG ready modes:\n\t\tMODE_1\n\t\tMODE_2\n\t\tMODE_3\n\t\tMODE_4\n\n\tIf function is EVSE, supported mode are:\n\t\tCharge\n\t\tDont_Charge\n"
        target_soc:
          type: integer
          description: "\tApplicable if functions is BATTERY\n\t\t% SOC at which event should end.\n\t\tIt is the upper limit for charge modes.\n\t\tIt is the lower limit for discharge modes.\n\t\tIt is not applicable for Idle mode\n"
          format: int32
        rate_watt:
          type: integer
          description: "Charge or discharge rate if functions is BATTERY. Not applicable for Idle mode\n\t\nSpecifies the curtailment level if functions is PV.\n\t\nNot applicable if functions is HP.\n\t\nNot applicable if functions is EVSE and mode is Dont_Charge.\n"
          format: int32
        superseded:
          type: boolean
          description: Overrides an existing event if true in case of timing overlap
        command_delivery_status:
          type: string
          description: "delivery status of the command sent to Envoy.\n\t\n-Scheduled : Command is not sent yet or sent to envoy or sent to envoy but not completed yet by envoy\n\t\n-Delivered : Command is completed by envoy\n\t\n-Failed : Command is sent to envoy but expired at envoy\n\t\n-Cancelled : Command is not sent to envoy (for example, service is down or event is deleted etc\n"
          enum:
          - Scheduled
          - Delivered
          - Failed
          - Cancelled
        measuring_reference:
          type: string
          description: Measuring Reference
          enum:
          - ASSET
          - SITE
        export_limit:
          type: integer
          description: Export limit for PV
          format: int32
    EventOptoutOptinRequest:
      required:
      - optout
      - site_id
      type: object
      properties:
        site_id:
          type: integer
          description: Site id which needs to be opted out/in from the event
          format: int32
        optout:
          type: boolean
          description: optout flag for the request. true for optout and false for optin
    EventCreateRequestV2:
      required:
      - functions
      - measuring_reference
      - program_id
      type: object
      properties:
        program_id:
          type: string
          description: 'Unique ID of the program

            '
        vpp_ids:
          uniqueItems: true
          type: array
          description: 'List of VPP IDs; Only one of the site_ids and vpp_ids must be passed

            '
          items:
            type: string
            description: 'List of VPP IDs; Only one of the site_ids and vpp_ids must be passed

              '
        measuring_reference:
          type: string
          description: 'measuring reference of the event; Supported values are {ASSET, SITE}

            measuring reference SITE is required in case of export limiting.

            For individual Asset/Function level control, measuring reference is ASSET

            '
          enum:
          - ASSET
          - SITE
        functions:
          type: array
          description: 'List of supported functions; Supported values are {BATTERY, PV, HP, EVSE}

            For individual Asset/Function level control, measuring reference is ASSET

            '
          items:
            type: string
            description: 'List of supported functions; Supported values are {BATTERY, PV, HP, EVSE}

              For individual Asset/Function level control, measuring reference is ASSET

              '
            enum:
            - BATTERY
            - PV
            - EVSE
            - HP
        rate_watt:
          type: integer
          description: "If functions is PV, specifies the PV curtailment level; If rate_watt is negative or 0, PV curtailment will be set to 0; If rate_watt is positive, PV curtailment will be set to min (PV capacity, rate_watt)\n\t\nIf functions is BATTERY, specifies the battery power; Positive for discharge events, Negative for charge events, and 0 for Idle event; If rate_watt is greater than rated power, it will be set to rated power\n\t\nIf function is HP, this is not applicable\n\t\nIf function is EVSE, specifies the charge rate for EV; Negative or zero for Charge mode, limits charging to set rate_watt; not required for Dont_Charge mode;If rate_watt value is greater than EV's rated power, then charging is limited to rated power;\n"
          format: int32
        mode:
          type: string
          description: "\tMode for the event; Mandatory if functions is  HP/EVSE, optional in case of Battery and not applicable in case of PV\n\n\tIf function is BATTERY,\n\t\t1. If mode is not passed, it is set to 'Discharge to Load and Grid' if rate_watt is positive\n\t\t2. If mode is not passed, it is set to 'Charge from PV and Grid' if rate_watt is negative\n\t\t3. If mode is not passed, it is set to 'Idle' if rate_watt is 0\n\t\t4. If mode is passed, rate_watt must be positive for discharge events, negative for charge events, 0 for Idle event\n\n\tIf function is BATTERY, supported modes are:\n\t\tIdle\n\t\tCharge_From_PV\n\t\tCharge_From_NetPV\n\t\tCharge_From_PV_Grid\n\t\tDischarge_To_Load\n\t\tDischarge_To_NetLoad\n\t\tDischarge_To_Load_Grid\n\n\tIf function is HP, supported modes are as per SG ready modes:\n\t\tMODE_1\n\t\tMODE_2\n\t\tMODE_3\n\t\tMODE_4\n\n\tIf function is EVSE, supported mode are:\n\t\tCharge\n\t\tDont_Charge\n"
          enum:
          - Charge_From_PV
          - Charge_From_NetPV
          - Charge_From_PV_Grid
          - Discharge_To_Load
          - Discharge_To_NetLoad
          - Discharge_To_Load_Grid
          - Idle
          - Charge
          - Dont_Charge
          - MODE_1
          - MODE_2
          - MODE_3
          - MODE_4
        target_soc:
          type: integer
          description: "\tApplicable if functions is BATTERY\n\t% SOC at which event should end.\n\tIt is the upper limit for charge modes.\n\tIt is the lower limit for discharge modes.\n\tIt is not applicable for Idle mode\n"
          format: int32
        start_time:
          type: string
          description: "\tStart time of the event;\n\tIf it not sent, it is set to the current time rounded to the next minute\n\tStart time must be within 7 days\n"
        end_time:
          type: string
          description: "\tEnd time of the event;\n\tOptional but one of end_time or duration must be passed\n\tMaximum supported event duration is 300 mins and minimum supported event duration is 5 mins\n"
        duration:
          type: integer
          description: "\tOptional but one of end_time or duration must be passed; Value in minutes\n\tMaximum supported event duration is 300 mins and minimum supported event duration is 1 mins\n"
          format: int32
        superseded:
          type: boolean
          description: 'Overrides an existing event if true in case of timing overlap

            '
        evse_serial_no:
          type: string
          description: "\tSerial Number of the individual EVSE\n"
        site_ids:
          uniqueItems: true
          type: array
          description: 'List of all the Site IDs in the event; Only one of the site_ids and vpp_ids must be passed

            '
          items:
            type: integer
            description: 'List of all the Site IDs in the event; Only one of the site_ids and vpp_ids must be passed

              '
            format: int32
        export_limit:
          minimum: 0
          type: integer
          description: 'When measuring reference is SITE, this field specifies the site export limit; it should be zero or positive only

            '
          format: int32
      description: New event details
