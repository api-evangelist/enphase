                        measuring_reference: ASSET
                    - event_id: f75b0ada-ee9b-4cdb-b0f1-b915267d203d
                      name: Event 202403241315
                      program_id: test
                      events:
                      - site_id: '698934046'
                        evse_serial_no: '7345120'
                        event_status: scheduled
                        start_time: '2024-03-24T13:15:00.000+00:00'
                        end_time: '2024-03-24T13:30:00.000+00:00'
                        created_at: '2024-03-24T11:15:00.000+00:00'
                        functions:
                        - EVSE
                        duration: 15
                        mode: Charge
                        rate_watt: 1200
                        command_delivery_status: Scheduled
                        measuring_reference: ASSET
        '400':
          description: Bad Request
          content:
            '*/*':
              examples:
                case-0:
                  value: "{\n  \"code\": \"400\",\n  \"displayMessage\": \"Pagination variables are incorrect\",\n  \"additionalInfo\": \"Pagination variables are incorrect. Page number should starts from 1 and page size should be between 1 and 100\",\n  \"errorRefNo\": \"e20fdf9aa241bea9\",\n}"
                case-1:
                  value: "{\n  \"code\": \"400\",\n  \"displayMessage\": \"Invalid start_date format\",\n  \"additionalInfo\": \"start_date format is invalid. start_date must be in yyyy-MM-dd format\",\n  \"errorRefNo\": \"e20fdf9aa241bea9\",\n}"
