          description: Bad Request
          content:
            '*/*':
              examples:
                case-0:
                  value: "{\n  \"code\": \"400\",\n  \"displayMessage\": \"rate_watt out of range\",\n  \"additionalInfo\": \"rate_watt cannot be less than 0 when its value is provided\",\n  \"errorRefNo\": \"e20fdf9aa241bea9\",\n}"
                case-1:
