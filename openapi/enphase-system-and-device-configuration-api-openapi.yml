components:
  schemas:
    RegisterLiveStreamStatusResponse:
      type: object
      properties:
        serial_number:
          type: string
          description: Envoy serial number
        status:
          type: string
          description: Registration status
          enum:
          - IN_PROGRESS
          - COMPLETED
          - FAILED
    OCPPConfigurationStatusResponse:
      type: object
      properties:
        configurationStatus:
          type: string
          description: "Charger status for the enrollment. Allowed values:<br>\n\tACTIVATION_IN_PROGRESS - Registration has been initiated and its in progress<br>\n\tDEACTIVATION_IN_PROGRESS - Revocation has been initiated and its in progress<br>\n\tACTIVATION_FAILED - Registration was initaited but it failed<br>\n\tDEACTIVATION_FAILED - Revocation was initiated but it failed<br>\n\tACTIVE - Registration successful<br>\n\tDEACTIVATED - Revocation successful"
        connectionUrl:
          type: string
          description: Partner's CSMS Url that is supplied by partner at the time of registration
        securityProfile:
          type: string
          description: 'Partner''s CSMS''s security profile that is supplued by partner at the time of registration '
        authKey:
          type: string
          description: Partner's CSMS one time token to be used for authorising charger's communication with the CSMS that is supplied at the time of registration
        connectionStatus:
          type: string
          description: "Indicates whether the charger has made successful connection with partner CSMS. Allowed values:<br>\n\tNOT_CONNECTED - Indicates that connection has not happened even once<br>\n\tCONNECTED - Indicates that connection is successful<br>\n\tDISCONNECTED - Indicates that connection was successful but currently its not connected"
        configurationStatusFailureReason:
          type: string
          description: Reason for ACTIVATION_FAILED or DEACTIVATION_FAILED
    OCPPConfigurationRequest:
      required:
      - connectionUrl
      type: object
      properties:
        connectionUrl:
          type: string
          description: 'Partner’s CSMS url to which the charger will establish communication '
        securityProfile:
          type: string
          description: Partner’s CSMS security profile
        authKey:
          type: string
          description: Partner's CSMS one time token to be used for authorizing charger's communication with the CSMS that is supplied at the time of registration
    ReservedSOCUpdateRequest:
      required:
      - vpp_event_reserve_soc
      type: object
      properties:
        vpp_event_reserve_soc:
          maximum: 100
          minimum: 0
          type: integer
          description: VPP Event's reserved SOC %. Value should be between 0 and 100 (Integers only)
          format: int32
    SiteSettingsResponseDTO:
      type: object
      properties:
        vpp_event_reserve_soc:
          type: integer
          format: int32
    StartStreamResponse:
      type: object
      properties:
        serial_number:
          type: string
          description: Envoy serial number
        status:
          type: string
          description: Command status
    OCPPResetResponse:
      type: object
      properties:
        message:
          type: string
    StopStreamResponse:
      type: object
      properties:
        serial_number:
          type: string
          description: Envoy Serial Number
        status:
          type: string
          description: Command Status
    OCPPConfigurationResponse:
      type: object
      properties:
        status:
          type: string
