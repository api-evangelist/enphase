  /api/v1/systems/{site_id}/telemetry/consumption_meter:
    get:
      tags:
      - System Details And Telemetry
      summary: Get telemetry for all consumption meters for a site
      description: 'Retrieves telemetry for all the consumption meters of a system. If the start_at specified is earlier than the system''s first reported date, then midnight of the system''s first reported date is considered as start_at. The end_at is calculated as the minimum of the time of the request and (start time + granularity).

        The meaning of granularity is as follow: If granularity is 15mins, maximum 1 interval will appear in response.

        If granularity is day, maximum 96 intervals will appear in response where each interval is of 15 mins duration.

        The requested start date must be within 2 years from current date. By default start_at will appear in response. If start_date parameter is passed in the url, then start_date field will appear in response. By default end_at will appear in response. If end_date parameter is passed in the url then end_date field will appear in response.

        '
      operationId: getConsumptionMeterTelemetry
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
      - name: start_date
        in: query
        required: false
        schema:
          type: string
      - name: start_at
        in: query
        description: Requested start time for telemetry data in Epoch time format. Alternatively one can use start_date in place of start_at for passing the start date as String in YYYY-MM-DD format. If no start_at is specified, defaults to midnight today, in the timezone of the system. If the start_at specified is earlier than the system's first reported date, then the system first reported date is considered as start_at. By default start_at will appear in response. If start_date parameter is passed in the url, then start_date field will appear in response.
        required: false
        schema:
          type: integer
          format: int32
      - name: end_at
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: end_date
        in: query
        required: false
        schema:
          type: string
      - name: interval_duration
        in: query
        description: Possible values are 5mins & 15mins. 5 mins interval_duration is supported only for the sites that are configured for 5 mins telemetry
        required: false
        schema:
          type: string
      - name: granularity
        in: query
        description: 'The granularity of the telemetry data. Possible values are ''week'', ''day'', ''15mins''. Default is ''day''

          Available values : 15mins, day, week

          '
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: Unique API Key of your account
        required: true
        schema:
          type: string
        example: your-api-key-here
      - name: Authorization
        in: header
        description: access_token generated from auth API must be passed as Authorization header
        required: true
        schema:
          type: string
        example: Bearer your-access-token
      responses:
        '200':
          description: Successfully retrieved consumption telemetry details
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SystemsConsumptionMeterResponse'
              examples:
                UnixTimestampExample:
                  summary: Example with Unix timestamps
                  description: UnixTimestampExample
                  value:
                    system_id: 698905955
                    granularity: day
                    total_devices: 9
                    start_at: 1496526300
                    end_at: 1496529300
                    items: intervals
                    intervals:
                    - end_at: 1384122700
                      devices_reporting: 1
                      enwh: 40
                    - end_at: 1384122740
                      devices_reporting: 1
                      enwh: 40
                    meta:
                      status: normal
                      last_report_at: 1445619615
                      last_energy_at: 1445619033
                      operational_at: 1357023600
                ISODateExample:
                  summary: Example with ISO 8601 date-time fields
