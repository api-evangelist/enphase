  /api/v1/systems/{site_id}/site_events:
    get:
      tags:
      - System Details And Telemetry
      summary: To retrieve the list of events for a site
      description: 'This endpoint is used to retrieve the events for a site. start_time is mandatory and cannot be older than 6 months from the current time.

        Maximum 1 week of data can be retrieved in a single call.An Event is triggered when a site/device meets a pre-defined set of conditions.

        Each of these pre-defined set of conditions is called an “Event type”. There are more than 1k+ event types in Enlighten.

        These conditions are defined at both site and device level, therefore events can be triggered at both site and device level. Each event is associated with an event type.

        Most Event types (not all) further have pre-defined configurations. Whenever an Event of a given Event type meets these pre-defined configurations,

        then the Event triggers an Alarm. An example of pre-defined configuration for an event type is -  Event status is “Open” beyond a certain time limit.

        '
      operationId: getSiteEvents
      parameters:
      - name: site_id
        in: path
        description: Unique Id of the site
        required: true
        schema:
          type: string
      - name: start_time
        in: query
        description: Requested start time of the events data in Epoch time format.
        required: true
        schema:
          type: integer
          format: int64
      - name: end_time
        in: query
        description: 'Requested end time of the events data in Epoch time format. Defaults to minimum of (start time + 1 day, current time)

          '
        required: false
        schema:
          type: integer
          format: int64
      - name: x-api-key
        in: header
        description: Unique API Key of your account
        required: true
        schema:
          type: string
        example: your-api-key-here
      - name: Authorization
        in: header
        description: access_token generated from auth API must be passed as Authorization header
        required: true
        schema:
          type: string
        example: Bearer your-access-token
      responses:
        '200':
          description: Retrieved the list of events for a site
