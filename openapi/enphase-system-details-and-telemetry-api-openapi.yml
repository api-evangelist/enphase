  /api/v1/systems/{site_id}/site_alarms:
    get:
      tags:
      - System Details And Telemetry
      summary: To retrieve the list of alarms for a site
      description: 'This endpoint is used to retrieve the alarms for a site. start_time is mandatory and cannot be older than 6 months from the current time.

        Maximum 1 week of data can be retrieved in a single call.An Alarm is always associated with an Event.

        Alarm and events can have one to one or one to many mapping. For ex - If a site has one battery unit and the SOC of the battery falls below a pre-defined limit,

        then an event will be created for that battery. If the battery SOC remains below this pre-defined SOC beyond a certain period of time (pre-defined for an alarm),

        then an alarm will be created for that battery. Similarly, if the site has multiple batteries and the SOC of all the batteries is below the pre-defined level, then individual event will be created for each battery.

        If all the batteries remain below this SOC beyond a certain period of time, then a single alarm will be created for all the batteries.

        Therefore, an alarm may be associated with multiple events but the reverse is not true.

        '
      operationId: getSiteAlarms
      parameters:
      - name: site_id
        in: path
        description: Unique Id of the site
        required: true
        schema:
          type: string
      - name: start_time
        in: query
        description: Requested start time of the events data in Epoch time format.
        required: true
        schema:
          type: integer
          format: int64
      - name: end_time
        in: query
        description: 'Requested end time of the events data in Epoch time format. Defaults to minimum of (start time + 1 day, current time)

          '
        required: false
        schema:
          type: integer
          format: int64
      - name: cleared
        in: query
        description: Filters alarms based on their status. Set to true to return cleared alarms. Defaults to false to return active alarms.
        required: false
        schema:
          type: boolean
      - name: x-api-key
        in: header
        description: Unique API Key of your account
        required: true
        schema:
          type: string
        example: your-api-key-here
      - name: Authorization
        in: header
        description: access_token generated from auth API must be passed as Authorization header
        required: true
        schema:
          type: string
        example: Bearer your-access-token
      responses:
        '200':
          description: Retrieved the list of alarms for a site
          content:
            '*/*':
