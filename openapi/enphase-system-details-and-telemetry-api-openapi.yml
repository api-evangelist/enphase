  /api/v1/systems/{site_id}/latest_telemetry:
    get:
      tags:
      - System Details And Telemetry
      summary: Returns a system's last reported PV Power, Consumption Power and Battery Power in Watts. Returns the operational mode for Battery, HP, and EVSE.
      description: 'Returns a system''s last reported PV Power, Consumption Power and Battery Power in Watts. Returns the operational mode for Battery, HP, and EVSE.


        HP Modes:


        Mode_1 - Blocked Operation<br>

        Mode_2 - Normal Operation<br>

        Mode_3 - Power Consumption Recommended<br>

        Mode_4 - Power Consumption Enforced


        EVSE Modes:


        PLUGGED_OUT - EVSE is not plugged in<br>

        IDLE - EVSE is plugged in but, EV is not charging<br>

        CHARGING - EVSE is plugged in and EV is charging<br>

        FAULTED - The EVSE connector is faulted


        If the last_report_at is older than 7 days, "last_report_at", "power" and "operational_mode" parameters will be returned in the response with the value as null.


        '
      operationId: getLatestTelemetry
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
      - name: x-api-key
        in: header
        description: Unique API Key of your account
        required: true
        schema:
          type: string
        example: your-api-key-here
      - name: Authorization
