  /api/v1/systems/{site_id}/hp_lifetime:
    get:
      tags:
      - System Details And Telemetry
      summary: Retrieves daily time-series telemetry data of the HP
      description: 'Retrieves daily time-series telemetry data of the HP

        The number of data points returned in the response corresponds to days spanned between the start_date and end_date

        parameter mentioned in the request.Requested start_date of the time series data defaults to the system’s operational date.

        If the start_date is earlier than the system’s operational_date, then the response data begins with the system operational_date as start_date.

        Pass as String date format YYYY-MM-DD.If end_date is not specified, then it defaults to today.

        '
      operationId: getDeviceLevelHPLifeTimeTelemetry
      parameters:
      - name: site_id
        in: path
        description: Unique Id of the site
        required: true
        schema:
          type: string
      - name: start_date
        in: query
        description: 'Start date for fetching the daily time-series data. Pass as String date format yyyy-mm-dd. Defaults to the system’s operational date.

          '
        required: false
        schema:
          type: string
      - name: end_date
        in: query
        description: 'End date for fetching the daily time-series data. Pass as String date format yyyy-mm-dd. Defaults to today.

          '
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: Unique API Key of your account
        required: true
        schema:
          type: string
        example: your-api-key-here
      - name: Authorization
        in: header
        description: access_token generated from auth API must be passed as Authorization header
        required: true
        schema:
          type: string
        example: Bearer your-access-token
      responses:
        '200':
          description: Retrieved daily time-series telemetry data of the HP
