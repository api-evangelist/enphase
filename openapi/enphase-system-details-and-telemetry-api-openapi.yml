components:
  schemas:
    SystemsAddress:
      type: object
      properties:
        state:
          type: string
        country:
          type: string
        postal_code:
          type: string
    SystemSummaryResponse:
      type: object
      properties:
        system_id:
          type: integer
          description: The unique numeric ID of the system
          format: int32
        current_power:
          type: integer
          description: Current power production of the system in Watts
          format: int32
        energy_lifetime:
          type: integer
          description: Energy generated by the system during its lifetime in Wh
          format: int32
        energy_today:
          type: integer
          description: Energy generated by the system today in Wh
          format: int32
        last_interval_end_at:
          type: string
          description: The last known time that the system produced energy. When a system has not been communicating for a length of time, the last_report_at can be recent, whereas the last_interval_end_at may be further back.
        last_report_at:
          type: integer
          description: Timestamp (in epoch format) at which the system's Envoy last submitted a report
          format: int32
        modules:
          type: integer
          description: Total number of modules in the system
          format: int32
        operational_at:
          type: integer
          description: Timestamp (in epoch format) at which this system became operational. Corresponds to the system’s interconnect time, if one is specified. Otherwise, it is the system’s first reported interval end time.
          format: int32
        size_w:
          type: integer
          description: System size in watts
          format: int32
        source:
          type: string
          description: Source of energy measurement
        status:
          type: string
          description: Current status of the system
        summary_date:
          type: string
          description: Summary date
        battery_charge_w:
          type: integer
          description: Maximum charge power of all the batteries of the system
          format: int32
        battery_discharge_w:
          type: integer
          description: Maximum discharge power of all the batteries of the system
          format: int32
        battery_capacity_wh:
          type: integer
          description: Total capacity of all the batteries of the system
          format: int32
    StorageMeter:
      type: object
      properties:
        serial_num:
          type: string
          description: The serial number of the meter
        value_charged:
          type: integer
          description: The meter reading for energy charged, in Wh
          format: int32
        value_discharged:
          type: integer
          description: The meter reading for energy discharged, in Wh
          format: int32
        read_at:
          type: integer
          description: The time when the reading was taken, always prior or equal to the requested 'end_at'
          format: int32
    Charge:
      type: object
      properties:
        enwh:
          type: integer
          format: int32
        devices_reporting:
          type: integer
          format: int32
    MeterReadingsMeta:
      type: object
      properties:
        status:
          type: string
          description: System's status. Corresponding Enlighten values can be found in table added at the end of page.
        last_report_at:
          type: integer
          description: Timestamp (in epoch format) at which the system's Envoy last submitted a report
          format: int64
        last_energy_at:
          type: integer
          description: Timestamp (in epoch format) at which the systems's production energy was last reported. Even if the last production energy is 0, its timestamp will be returned.
          format: int64
        operational_at:
          type: integer
          description: Corresponds to the system’s interconnect time, if one is specified. Otherwise, it is the system’s first reported interval end time.
          format: int64
    SystemsProductionLifeTimeResponse:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        system_id:
          type: string
          description: Unique ID of the site
        start_date:
          type: string
          description: "When no start_date parameter is specified on the request, this is the operational_date of the system.\n May be null if system has never produced.\n When a start_date parameter is included in the request, it is included here in the response."
        meter_start_date:
          type: string
          description: "The first day in the time series when measurements are taken from a meter instead of from micro inverters.\n This field is not present unless the system has a meter"
        production:
          type: array
          description: "An array of production measurements, one for each day since the system started producing, or one for each day of the requested period.\n If the system has never produced energy, the array may be empty."
          items:
            type: integer
            description: "An array of production measurements, one for each day since the system started producing, or one for each day of the requested period.\n If the system has never produced energy, the array may be empty."
            format: int32
        micro_production:
          type: array
          items:
            type: integer
            format: int32
        meter_production:
          type: array
          items:
            type: integer
            format: int32
    EVSELifeTimeTelemetryResponse:
      type: object
      properties:
        system_id:
          type: string
          description: Unique ID of the site
        start_date:
          type: string
          description: Start Date of the daily time-series data series.
        end_date:
          type: string
          description: End Date of the daily time-series data series.
        consumption:
          type: array
          description: Energy units consumed per day (positive will correspond to EV charge, negative will correspond to EV discharge). The time series includes one entry for each day from the start_date to the end_date with no gaps in the time series. If the response contains trailing zeroes, such as [909, 4970, 0, 0, 0], then there is not charge/discharge of the EV during those days.
          items:
            type: number
            description: Energy units consumed per day (positive will correspond to EV charge, negative will correspond to EV discharge). The time series includes one entry for each day from the start_date to the end_date with no gaps in the time series. If the response contains trailing zeroes, such as [909, 4970, 0, 0, 0], then there is not charge/discharge of the EV during those days.
            format: double
    SiteOpenEventsResponse:
      type: object
      properties:
        system_id:
          type: string
          description: The unique numeric ID of the system
        events:
          type: array
          description: List of events over the system
          items:
            $ref: '#/components/schemas/SiteEvent'
    SystemsConsumptionLifeTimeResponse:
      type: object
      properties:
        consumption:
          type: array
          description: An array of consumption measurements in Wh, one for each day since consumption metering began, or one for each day of the requested period
          items:
            type: integer
            description: An array of consumption measurements in Wh, one for each day since consumption metering began, or one for each day of the requested period
            format: int32
        meta:
          $ref: '#/components/schemas/Meta'
        system_id:
          type: string
          description: Unique ID of the site
        start_date:
          type: string
          description: "When no start_date parameter is specified on the request, this is the operational_date of the system.\n May be null if system has never produced.\n When a start_date parameter is included in the request, it is included here in the response."
        meter_start_date:
          type: string
          description: "The first day in the time series when measurements are taken from a meter instead of from micro inverters.\n This field is not present unless the system has a meter"
    DeviceLatestTelemetry:
      type: object
      properties:
        id:
          type: integer
          description: Device ID
          format: int64
        name:
          type: string
          description: Device Name
        serial_number:
          type: string
          description: Serial Number
        channel:
          type: integer
          description: The reporting channel ID (applicable only in case of meters)
          format: int32
        last_report_at:
          type: integer
          description: Timestamp at which the device last reported
          format: int64
        power:
          type: integer
          description: power reading at the last reported time
          format: int32
        operational_mode:
          type: string
          description: Battery mode. Possible values are Idle, Charging, Discharging<br>EVSE mode. Possible values are PLUGGED_OUT,IDLE,CHARGING,FAULTED<br>HP mode. Possible values are Mode_1,Mode_2,Mode_3,Mode_4.
    SystemsDetails:
      type: object
      properties:
        system_id:
          type: integer
          description: The unique numeric ID of the system
          format: int32
        name:
          type: string
          description: Name of the system
        public_name:
          type: string
          description: Name displayed on the public system page. Available values are All, Residential System, Commercial etc. Default='Residential System'. Only for systems that allow public access
        timezone:
          type: string
          description: Timezone to which the system belongs
        connection_type:
          type: string
          description: connection Type of the system. Available values are ethernet, Wi-Fi, Cellular
        status:
          type: string
          description: System's status. Corresponding Enlighten values can be found in table added at the end of page
        attachment_type:
          type: string
          description: Micro inverter attachment type. Available values are rack_mount, zep, acm, bipv, frame_mount, railless_mount
        interconnect_date:
          type: string
          description: Date on which the system was approved to connect to the grid
        last_energy_at:
          type: integer
          description: Timestamp (in epoch format) at which the systems's produced energy was last reported. Even if the last produced energy is 0, its timestamp will be returned
          format: int64
        last_report_at:
          type: integer
          description: Timestamp (in epoch format) at which the system's Envoy last submitted a report
          format: int64
        operational_at:
          type: integer
          description: Timestamp (in epoch format) at which this system became operational. Corresponds to the system’s interconnect time, if one is specified. Otherwise, it is the system’s first reported interval end time
          format: int64
        address:
          $ref: '#/components/schemas/SystemsAddress'
    StorageMeterReadings:
      type: object
      properties:
        system_id:
          type: integer
          description: The unique numeric ID of the system
          format: int32
        meter_readings:
          type: array
          items:
            $ref: '#/components/schemas/StorageMeter'
        meta:
          $ref: '#/components/schemas/MeterReadingsMeta'
    ConsumptionMeterReadings:
      type: object
      properties:
        system_id:
          type: integer
          description: The unique numeric ID of the system
          format: int32
        meter_readings:
          type: array
          items:
            $ref: '#/components/schemas/MeterReadings'
        meta:
          $ref: '#/components/schemas/MeterReadingsMeta'
    HPTelemetryInterval:
      type: object
      properties:
        end_at:
          type: integer
          description: End time of the telemetry interval.
          format: int64
        wh_consumed:
          type: number
          description: Units consumed per interval. This value can only be zero or positive
          format: double
    SystemsBatterySettingsResponse:
      type: object
      properties:
        system_id:
          type: integer
          description: Unique ID of the site
          format: int32
        battery_mode:
          type: string
          description: Current battery mode of the system. Possible values are Savings Mode, Full Backup, and Self - Consumption
        reserve_soc:
          type: integer
          description: Reserve soc for the current mode
          format: int32
        energy_independence:
          type: string
          description: 'Energy independence after peak hours enabled/disabled . Enabled: Battery will discharge to save money during peak hours when electricity rates are high. Once that is done, energy independence is prioritized. This will increase the energy self-sufficiency until the reserve soc is hit. Battery will charge from solar in the morning to get ready for the next period Disabled: Battery will discharge only during peak hours when electricity rates are high. During other times, battery will be idle or will charge from solar in the morning to get ready for the next period'
        charge_from_grid:
          type: string
          description: 'Charge battery from grid enabled/disabled. Enabled: Battery may also charge from the grid when in full backup mode or when battery charge is below the reserve capacity in savings or self-consumption mode'
        battery_shutdown_level:
          type: integer
          description: Level at which battery shutdowns to conserve energy. Battery restarts by using the conserved energy when the utility grid restores power or solar panels start producing energy
          format: int32
    SystemsDevicesResponse:
      type: object
      properties:
        system_id:
          type: integer
          format: int32
        total_devices:
          type: integer
          format: int32
