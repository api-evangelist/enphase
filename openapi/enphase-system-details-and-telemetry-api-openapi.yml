  /api/v1/systems/{site_id}/devices/micros/{serial_no}/telemetry:
    get:
      tags:
      - System Details And Telemetry
      summary: Retrieves telemetry for single micro/pcu.
      description: 'Retrieves telemetry for single micro/pcu.

        If no start_at is specified, defaults to midnight today, in the timezone of the system. If the start_at specified is earlier than the system''s first reported date, then midnight of the system''s first reported date is considered as start_at.

        The end_at is calculated as the minimum of the time of the request and (start time + granularity).


        The meaning of granularity is as follow:

        If granularity is 15 mins, maximum 3 intervals will appear in response. If granularity is day, maximum 288 intervals will appear in response where each interval is of 5 mins duration.


        The requested start date must be within 2 years from current date.

        By default start_at will appear in response. If start_date parameter is passed in the url, then start_date field will appear in response.

        By default end_at will appear in response. If end_date parameter is passed in the url then end_date field will appear in response. Empty list will be returned if the last interval < requested start time < current time.

        '
      operationId: getDeviceLevelPVProductionTelemetry
      parameters:
      - name: site_id
        in: path
        description: Unique ID of the site
        required: true
        schema:
          type: string
      - name: serial_no
        in: path
        description: The device serial number
        required: true
        schema:
          type: string
      - name: start_at
        in: query
        description: "Start time for fetching the telemetry data in Epoch time format.\n If no start_at is specified, defaults to midnight today, in the timezone of the system.\n If the start_at specified is earlier than the system's first reported date, then midnight of the system's first reported date is considered as start_at.\n"
        required: false
        schema:
          type: integer
          format: int64
      - name: end_at
        in: query
        description: 'The end_at is calculated as the minimum of the time of the request and (start time + granularity)

          '
        required: false
        schema:
          type: integer
          format: int64
      - name: start_date
        in: query
        description: "Start date for fetching the telemetry data in yyyy-mm-dd format\n If no start_date is specified, defaults to midnight today, in the timezone of the system.\n If the start_date specified is earlier than the system's first reported date, then midnight of the system's first reported date is considered as start_date\n"
        required: false
        schema:
          type: string
      - name: end_date
        in: query
        description: 'The end_at is calculated as the minimum of the time of the request and (start time + granularity)

          '
        required: false
        schema:
          type: string
      - name: granularity
        in: query
        description: "The granularity of the telemetry data.\n Possible values are 'week', 'day', '15mins', '5mins'. Default is 'day'\n"
        required: false
        schema:
          type: string
          default: day
      - name: x-api-key
        in: header
        description: Unique API Key of your account
        required: true
        schema:
          type: string
        example: your-api-key-here
      - name: Authorization
        in: header
        description: access_token generated from auth API must be passed as Authorization header
        required: true
        schema:
          type: string
        example: Bearer your-access-token
      responses:
        '200':
          description: Successfully retrieved device level PV production telemetry data
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DeviceLevelPVProductionResponse'
              examples:
                EpochTimestampExample:
                  summary: Response with epoch timestamps
                  description: EpochTimestampExample
                  value:
                    system_id: 1765
                    serial_number: '12345'
                    granularity: day
                    total_devices: 1
                    start_at: 1496526300
                    end_at: 1496529300
                    items: intervals
                    intervals:
                    - end_at: 1496526300
                      powr: 30
                      enwh: 40
                    - end_at: 1496526600
                      powr: 20
                      enwh: 40
                ISODateExample:
                  summary: Response with ISO 8601 date format
                  description: ISODateExample
                  value:
                    system_id: 1765
                    serial_number: '12345'
                    granularity: day
                    total_devices: 1
                    start_date: '2024-09-22T00:00:00-04:00'
                    end_date: '2024-09-23T00:00:00-04:00'
                    items: intervals
                    intervals:
                    - end_at: 1496526300
                      powr: 30
                      enwh: 40
                    - end_at: 1496526600
                      powr: 20
                      enwh: 40
