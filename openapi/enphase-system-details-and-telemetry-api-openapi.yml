  /api/v1/systems/event_types:
    get:
      tags:
      - System Details And Telemetry
      summary: To retrieve the list of event_type_id along with event_description and recommended_action
      description: 'This endpoint is used to retrieve the list of all available event_types. The endpoint will return list of event_type_id along with the

        event_description and recommended_action. If an event_type_id is passed, this endpoint will return the detail of specific event_type

        '
      operationId: getEventTypes
      parameters:
      - name: event_type_id
        in: query
        description: The unique numeric ID of the event type.
        required: false
        schema:
          type: integer
          format: int32
      - name: x-api-key
        in: header
        description: Unique API Key of your account
        required: true
        schema:
          type: string
        example: your-api-key-here
      - name: Authorization
        in: header
        description: access_token generated from auth API must be passed as Authorization header
        required: true
        schema:
          type: string
        example: Bearer your-access-token
      responses:
        '200':
          description: Retrieved the list of event_type_id along with event_description and recommended_action
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventTypesResponse'
              examples:
                EventTypesResponseExample:
                  summary: List of event_type_id along with event_description and recommended_action
                  description: EventTypesResponseExample
                  value:
                    event_types:
                    - event_type_id: 1234
                      event_type_key: env_rpt_issue
                      stateful: true
                      event_name: Envoy issue
                      event_description: Envoy not reporting
                      recommended_action: Restart envoy
                    - event_type_id: 4781
                      event_type_key: acb_sleeping
                      stateful: false
                      event_name: AC Battery Sleeping
                      event_description: AC Battery has entered the target state of charge band. Cleared when the battery exits the state of charge target, or sleep mode is removed.
                      recommended_action: No action is required.
                    - event_type_id: 28
                      event_type_key: envoy_no_report
                      stateful: true
                      event_name: Gateway not reporting
                      event_description: The broadband Internet connection that the Enphase gateway uses to communicate to the Enphase servers is experiencing a problem.
                      recommended_action: Check that your gateway and Internet router are plugged in and that the site's Internet service is not experiencing an outage.
        '400':
          description: Bad Request
          content:
            '*/*':
              examples:
                case-0:
                  value: "{\n  \"code\": \"400\",\n  \"displayMessage\": \"Type Mismatch\",\n  \"additionalInfo\": \"Cannot cast the parameter to required type xxxx\",\n  \"errorRefNo\": \"e20fdf9aa241bea9\",\n}"
                case-1:
