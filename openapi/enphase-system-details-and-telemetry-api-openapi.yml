  /api/v1/systems/{site_id}/export_lifetime:
    get:
      tags:
      - System Details And Telemetry
      summary: export_lifetime
      description: "Returns a daily time series of energy exported to the grid by the system over its lifetime. All measurements are in Watt-hours.\n The time series includes one entry for each day from the start_date to the end_date with no gaps in the time series.\n If the response contains trailing zeroes, such as [909, 4970, 0, 0, 0], then no energy has been exported for the last days in the series.\n"
      operationId: getLifeTimeExport
      parameters:
      - name: site_id
        in: path
        description: Unique ID of the site
        required: true
        schema:
          type: string
      - name: start_date
        in: query
        description: "Start date of the time series data. Defaults to the system's operational date.\n If the start_date is earlier than the system's operational_date, then the response data begins with the system operational_date as start_date.\n Pass as String date format YYYY-MM-DD.\n"
        required: false
        schema:
          type: string
      - name: end_date
        in: query
        description: "End date of the time series data. Defaults to yesterday.\n Pass as String date format YYYY-MM-DD\n"
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: Unique API Key of your account
        required: true
        schema:
          type: string
        example: your-api-key-here
      - name: Authorization
        in: header
        description: access_token generated from auth API must be passed as Authorization header
        required: true
        schema:
          type: string
        example: Bearer your-access-token
      responses:
        '200':
          description: Successfully retrieved export lifetime values
          content:
            '*/*':
              schema:
