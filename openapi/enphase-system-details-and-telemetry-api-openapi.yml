  /api/v1/systems/{site_id}/storage_meter_readings:
    get:
      tags:
      - System Details And Telemetry
      summary: To retrieve the last known reading of each storage meter on the system as of the requested time
      description: 'Returns the last known reading of each storage meter on the system as of the requested time,

        regardless of whether the meter is currently in service or retired. Read_at is the time at which the reading was taken,

        and is always less than or equal to the requested end_at. Commonly, the reading will be within 30 minutes of the

        requested end_at. However, larger deltas can occur and do not necessarily mean there is a problem with the meter or the system.

        Systems that are configured to report infrequently can show large deltas on all meters, especially when end_at is close to the current time.

        Meters that have been retired from a system will show an end_at that doesn’t change, and that eventually is far away from the current time.

        '
      operationId: getStorageMeterReadings
      parameters:
      - name: site_id
        in: path
        description: Unique Id of the site
        required: true
        schema:
          type: string
      - name: end_at
        in: query
        description: 'End of reporting period in Unix epoch time. If no end is specified, defaults to the time of the request.

          If the end is later than the last reported interval the response data ends with the last reported interval

          '
        required: false
        schema:
          type: integer
          format: int64
      - name: x-api-key
        in: header
        description: Unique API Key of your account
        required: true
        schema:
          type: string
        example: your-api-key-here
      - name: Authorization
        in: header
        description: access_token generated from auth API must be passed as Authorization header
        required: true
        schema:
          type: string
        example: Bearer your-access-token
      responses:
        '200':
          description: Retrieved the last known reading of each storage meter on the system as of the requested time.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/StorageMeterReadings'
              examples:
                StorageMeterReadingsExample:
                  summary: List of last known reading of each storage meter on the system as of the requested time.
                  description: StorageMeterReadingsExample
                  value:
                    system_id: 66
                    meter_readings:
                    - serial_num: 123123123123EIM4
