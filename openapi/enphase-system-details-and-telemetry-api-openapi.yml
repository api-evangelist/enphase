  /api/v1/systems/{site_id}/production_lifetime:
    get:
      tags:
      - System Details And Telemetry
      summary: production_lifetime
      description: 'Returns a daily time series of energy produced by the system over its lifetime. All measurements are in Watt hours.


        The time series includes one entry for each day from the start_date to the end_date with no gaps in the time series.

        If the response includes trailing zeroes, such as [909, 4970, 0, 0, 0], then no energy has been reported for the last days in the series.


        If the system has a meter, the time series includes data as measured by the micro inverters until the first full day after the meter has been installed.

        Later, it switches to using the data as measured by the meter.

        This is called the "merged time series".

        The attribute "meter_start_date" indicates the time when the meter measurements begin to be used.

        You can retrieve the complete time series from the meter and from the micro inverters by adding the parameter production=all to the request.'
      operationId: getProductionLifeTime
      parameters:
      - name: site_id
        in: path
        description: Unique ID of the site
        required: true
        schema:
          type: string
      - name: start_date
        in: query
        description: "Start date of the time series data. Defaults to the system's operational date.\n If the start_date is earlier than the system's operational_date, then the response data begins with the system operational_date as start_date.\n Pass as String date format YYYY-MM-DD.\n"
        required: false
        schema:
          type: string
      - name: end_date
        in: query
        description: "End date of the time series data. Defaults to yesterday.\n Pass as String date format YYYY-MM-DD\n"
        required: false
        schema:
          type: string
      - name: production
        in: query
        description: "When \"all\", returns the merged time series plus the time series as reported by the micro inverters and the meter on the system.\n Other values are ignored.\n"
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: Unique API Key of your account
        required: true
        schema:
          type: string
        example: your-api-key-here
      - name: Authorization
        in: header
        description: access_token generated from auth API must be passed as Authorization header
        required: true
        schema:
          type: string
        example: Bearer your-access-token
      responses:
        '200':
          description: Successfully retrieved lifetime production values
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SystemsProductionLifeTimeResponse'
              examples:
                ProductionLifetimeExample:
                  summary: Example of lifetime production values
                  description: ProductionLifetimeExample
