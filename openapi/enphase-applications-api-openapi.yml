    post:
      tags:
      - Applications
      summary: Create new application
      description: 'Create a new application to enroll or unenroll a site into a program. The site must belong to the same state as the program''s state and must not be enrolled in any other program.

        The API will also support users to send up to 4 application forms in PDF format with a file size limit of 1MB. Applications when created will be in submitted state and after approval, the state gets updated to approved.

        Applications that are rejected will get updated to rejected state.


        Application body in string is mandatory. It needs to be in format {"site_id":site_id_value as integer, "program_id":"program_id_value as string", "ean":"electric account number as string optional"}.


        application_type can be enrollment or unenrollment. It needs to be in format {"application_type":"unenrollment"}. If not provided then it is considered as enrollment

        '
      operationId: createApplication
      parameters:
      - name: ho-access-token
        in: header
        description: Access token generated through oAuth for program enrollment
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: Unique API Key of your account
        required: true
        schema:
          type: string
        example: your-api-key-here
      - name: Authorization
        in: header
        description: access_token generated from auth API must be passed as Authorization header
        required: true
        schema:
          type: string
        example: Bearer your-access-token
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                application_form:
                  type: string
                  description: Application Body as a String. Format {"site_id":12345, "program_id":"test", "ean":"112233"}
                application_type:
                  type: string
                  description: Application Type as a String. Format {"application_type":"enrollment"}
                signed_enrollment_form:
                  type: string
                  description: Signed Enrollment Form URL
                  format: binary
                signed_tandc_form:
                  type: string
                  description: Signed TandC Form URL
                  format: binary
                signed_form1:
                  type: string
                  description: Signed Form1
                  format: binary
                signed_form2:
                  type: string
                  description: Signed Form2
                  format: binary
      responses:
        '200':
          description: Various possible success responses
          content:
            '*/*':
              schema:
                type: string
              examples:
                ApprovalSuccess:
                  description: ApprovalSuccess
                  value: Application for site_id = 658967 approved successfully !
                ApplicationCreated:
                  description: ApplicationCreated
                  value: 'Application ID : 12345 for site with site_id = 658967 created successfully!'
                SiteUnenrolled:
                  description: SiteUnenrolled
                  value: 'Site with Site ID : 12345 unenrolled successfully!'
                UnenrollmentSubmitted:
                  description: UnenrollmentSubmitted
                  value: 'Unenrollment application id: 20212 for Site with Site ID : 12345 submitted successfully. The unenrollment requests will be processed in 3 business days, please contact gridservicessupport@enphaseenergy.com in case of any issues.'
        '400':
          description: Bad Request
          content:
            '*/*':
              examples:
                case-0:
                  value: "{\n  \"code\": \"400\",\n  \"displayMessage\": \"Multipart File Upload Error\",\n  \"additionalInfo\": \"the request was rejected because no multipart boundary was found\",\n  \"errorRefNo\": \"e20fdf9aa241bea9\",\n}"
                case-1:
                  value: "{\n  \"code\": \"400\",\n  \"displayMessage\": \"Application Form is not provided\",\n  \"additionalInfo\": \"Application Form is mandatory. Please provide required details\",\n  \"errorRefNo\": \"e20fdf9aa241bea9\",\n}"
                case-2:
                  value: "{\n  \"code\": \"400\",\n  \"displayMessage\": \"Bad request, File format is not supported\",\n  \"additionalInfo\": \"File Format Not Allowed\",\n  \"errorRefNo\": \"e20fdf9aa241bea9\",\n}"
                case-3:
                  value: "{\n  \"code\": \"400\",\n  \"displayMessage\": \"Bad request, Not enough details in Application body\",\n  \"additionalInfo\": null,\n  \"errorRefNo\": \"e20fdf9aa241bea9\",\n}"
