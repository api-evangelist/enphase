  /api/v1/applications/{site_id}/withdraw:
    put:
      tags:
      - Applications
      summary: Withdraw an application that is not yet approved
      description: "Withdraw an application from a program based on the inputted site_id.\n\n Applications that are already approved cannot be withdrawn.\n"
      operationId: withdrawApplication
      parameters:
      - name: site_id
        in: path
        description: Site Id
        required: true
        schema:
          type: integer
          format: int32
      - name: program_id
        in: query
        description: Unique ID of the program
        required: true
        schema:
          type: string
      - name: x-api-key
        in: header
        description: Unique API Key of your account
        required: true
        schema:
          type: string
        example: your-api-key-here
      - name: Authorization
        in: header
        description: access_token generated from auth API must be passed as Authorization header
        required: true
        schema:
          type: string
        example: Bearer your-access-token
      responses:
        '200':
          description: Application withdrawn successfully
          content:
            '*/*':
              schema:
                type: string
              examples:
                Success:
                  description: Success
                  value: 'Application ID : 12345 for site with site_id = 658967 withdrawn successfully!'
