components:
  schemas:
    GsApiApplication:
      required:
      - program_id
      - site_id
      - site_info
      type: object
      properties:
        site_id:
          type: integer
          format: int32
        program_id:
          type: string
        application_id:
          type: integer
          description: application_id - String | Starts from 10,000 | uniquely identifies an application in logical manner
          format: int64
        application_status:
          type: string
          description: ApplicationStatus Enum - Enrollment Manager | Grid Services
          enum:
          - Application_Drafted
          - Application_Submitted
          - Application_Rejected
          - Application_Approved
          - Site_Submitted
          - Site_Rejected
          - Site_Approved
          - Application_Withdrawn
        created_at:
          type: string
          description: created_at - String | Timestamp of when application was created
          format: date-time
        approved_at:
          type: string
          description: approved_at - String | Timestamp of when application was approved
          format: date-time
        rejected_at:
          type: string
          description: rejected_at - String | Timestamp of when application was rejected
          format: date-time
        withdrawn_at:
          type: string
          description: withdrawn_at - String | Timestamp of when application was withdrawn
          format: date-time
        site_info:
          $ref: '#/components/schemas/GsApiApplicationFormFields'
        application_type:
          type: string
          description: application_type - ApplicationType | enrollment or unenrollment
    GsApiListApplicationResponse:
      type: object
      properties:
        page_no:
          type: integer
          format: int32
        page_size:
          type: integer
          format: int32
        count:
          type: integer
          format: int32
        total_count:
          type: integer
          format: int32
        applications:
          type: array
          items:
            $ref: '#/components/schemas/GsApiApplication'
    GsApiApplicationFormFields:
      required:
      - city
      - country
      - first_name
      - postal_code
      - state
      - zip
      type: object
      properties:
        city:
