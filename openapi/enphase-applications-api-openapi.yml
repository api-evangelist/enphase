  /api/v1/applications:
    get:
      tags:
      - Applications
      summary: Retrieve all applications of a program
      description: Returns a paginated list of all the applications of a program based on the inputted program_id. By default, 10 applications are returned in a page.
      operationId: getApplications
      parameters:
      - name: program_id
        in: query
        description: Unique ID of the program
        required: true
        schema:
          type: string
      - name: site_id
        in: query
        description: Unique ID of the Site
        required: false
        schema:
          type: integer
          format: int32
      - name: page_no
        in: query
        description: Page to be returned. Default=1, Min=1. For example, if page_no is set to 2, 2nd page is returned
        required: false
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 1
      - name: page_size
        in: query
        description: Maximum number of records shown per page. Default=10, Min=1, Max=100. For example, if max is set to 5, 5 records are shown per page
        required: false
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 10
      - name: x-api-key
        in: header
        description: Unique API Key of your account
        required: true
        schema:
          type: string
        example: your-api-key-here
      - name: Authorization
        in: header
        description: access_token generated from auth API must be passed as Authorization header
        required: true
        schema:
          type: string
        example: Bearer your-access-token
      responses:
        '200':
          description: Successfully retrieved Application details
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GsApiListApplicationResponse'
              examples:
                Sample Response:
                  description: Sample Response
                  value:
                    page_no: 1
                    page_size: 10
                    count: 2
                    total_count: 2
                    applications:
                    - site_id: 123456
                      program_id: test
                      application_id: 10130
                      application_status: Application_Submitted
                      application_type: enrollment
                      created_at: '2022-03-24T06:47:37.000+00:00'
                      site_info:
                        city: Newport
                        state: RI
                        zip: 0
                        ean: '12345'
                        first_name: TestUser
                        last_name: S
                        country: USA
                        postal_code: T3L 2G9
                    - site_id: 9876987
                      program_id: test
                      application_id: 10157
                      application_status: Application_Submitted
                      application_type: unenrollment
                      created_at: '2022-04-06T04:46:56.000+00:00'
                      site_info:
                        city: Williston
                        state: VT
                        zip: 5495
                        ean: '112233'
                        first_name: Test123
                        last_name: xyz
                        country: USA
                        postal_code: '5495'
        '400':
          description: Bad Request
          content:
            '*/*':
